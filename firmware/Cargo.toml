[package]
name = "firmware"
version = "0.1.0"
authors = ["Zhivko Yordanov Krastev <z.y.krastev@student.tugraz.at>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

# Temporary workaround trial for Xtensa LLVM 21 aggregate-float codegen crashes.
# Generic serde float deserialization is instantiated inside powderbot-core.
# https://github.com/esp-rs/rust/issues/277
[profile.dev.package.powderbot-core]
opt-level = 0

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }

[dependencies]
log = { version = "0.4", features = ["std"] }
anyhow = "1"
embedded-svc = "0.29"
ssd1306 = "0.10"
embedded-graphics = "0.8"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
powderbot-core = { version = "0.1.0", path = "../core" }

[features]
default = []
# Runs a short motor test once at EVERY boot of this firmware image.
motor-test = []
# Formats only after a failed mount; remove from the image after initialization.
storage-init = []
storage-test = []

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.14" }

[build-dependencies]
embuild = "0.33.5"
